services:
  postgres:
    image: postgres:16
    container_name: career-copilot-postgres
    environment:
      POSTGRES_DB: career_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - career_copilot_data:/var/lib/postgresql/data

volumes:
  career_copilot_data: