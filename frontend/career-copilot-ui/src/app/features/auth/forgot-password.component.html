<main class="auth-page">
  <section class="auth-intro" aria-hidden="true">
    <span class="mini-card">Account help</span>
    <span class="mini-card">Secure reset</span>
    <span class="mini-card">Coming soon</span>
  </section>

  <section class="auth-card">
    <div class="brand-row">
      <a class="logo-link" routerLink="/" aria-label="Go to Career Copilot home">
        <img class="auth-logo" src="assets/career-copilot-logo.png" alt="Career Copilot">
      </a>
    </div>
    <h1>Forgot password?</h1>
    <p>Enter your email to keep this page ready for the secure reset flow.</p>

    <form class="auth-form" (submit)="$event.preventDefault()">
      <label>
        <span>Email</span>
        <input type="email" autocomplete="email" [value]="email" (input)="onEmailInput($event)" placeholder="you@example.com">
      </label>

      <p class="auth-info">
        Password reset email feature is coming soon. For now, please contact admin/support.
      </p>
    </form>

    <p class="auth-switch">
      Remembered your password?
      <a routerLink="/login">Back to login</a>
    </p>
  </section>
</main>
